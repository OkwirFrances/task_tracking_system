<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracking System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <h1 style="margin: 0;">🚀 Task Tracking System</h1>
            <div style="display: flex; gap: 10px; align-items: center;">
                <span id="userDisplay" style="color: white; font-size: 14px;"></span>
                <button onclick="logout()" style="background-color: rgba(255,255,255,0.2); color: white; border: 1px solid white; padding: 8px 16px; border-radius: 4px; cursor: pointer;">🚪 Logout</button>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="sidebar">
            <h3>📊 Controls</h3>
            <button onclick="showAddTaskModal()" class="btn-primary">➕ Add Task</button>
            <button onclick="showProgressModal()" class="btn-secondary">📝 Log Progress</button>
            <button onclick="refreshData()" class="btn-secondary">🔄 Refresh</button>
            <hr>
            <h3>🔍 Filters</h3>
            <label>Status:</label>
            <select id="statusFilter" onchange="applyFilters()">
                <option value="all">All Statuses</option>
                <option value="pending">Pending</option>
                <option value="in-progress">In Progress</option>
                <option value="completed">Completed</option>
                <option value="delayed">Delayed</option>
                <option value="on-hold">On Hold</option>
            </select>
            <label>Priority:</label>
            <select id="priorityFilter" onchange="applyFilters()">
                <option value="all">All Priorities</option>
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
            </select>
            <label>Location:</label>
            <select id="locationFilter" onchange="applyFilters()">
                <option value="all">All Locations</option>
            </select>
        </div>

        <div class="main">
            <div class="dashboard">
                <div class="summary-card">
                    <div class="summary-item">
                        <h4>📊 Total Tasks</h4>
                        <div class="summary-value" id="totalTasks">0</div>
                    </div>
                    <div class="summary-item">
                        <h4>✅ Completed</h4>
                        <div class="summary-value" id="completedTasks">0</div>
                    </div>
                    <div class="summary-item">
                        <h4>🔄 In Progress</h4>
                        <div class="summary-value" id="inProgressTasks">0</div>
                    </div>
                    <div class="summary-item">
                        <h4>📈 Avg Progress</h4>
                        <div class="summary-value" id="avgProgress">0%</div>
                    </div>
                </div>
            </div>

            <div class="gantt-section">
                <h2>📅 Gantt Chart</h2>
                <div class="gantt-timeline" id="ganttTimeline"></div>
                <div class="gantt-chart" id="ganttChart"></div>
            </div>

            <div class="activity-section">
                <h2>📌 Recent Activity</h2>
                <div class="activity-feed" id="activityFeed"></div>
            </div>
        </div>
    </div>

    <!-- Task Modal -->
    <div id="taskModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('taskModal')">&times;</span>
            <h2 id="modalTitle">Add New Task</h2>
            <form id="taskForm">
                <input type="hidden" id="taskId">
                <input type="text" id="taskTitle" placeholder="Task Title" required>
                <textarea id="taskDescription" placeholder="Task Description"></textarea>
                <input type="datetime-local" id="taskStartDate" required>
                <input type="datetime-local" id="taskEndDate" required>
                <input type="range" id="taskProgress" min="0" max="100" value="0">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <select id="taskStatus">
                        <option value="pending">Pending</option>
                        <option value="in-progress">In Progress</option>
                        <option value="completed">Completed</option>
                        <option value="delayed">Delayed</option>
                        <option value="on-hold">On Hold</option>
                    </select>
                    <select id="taskPriority">
                        <option value="low">Low Priority</option>
                        <option value="medium" selected>Medium Priority</option>
                        <option value="high">High Priority</option>
                    </select>
                </div>
                <input type="text" id="taskAssignedTo" placeholder="Assigned To">
                <select id="taskLocation">
                    <option value="Office">🏢 Office</option>
                    <option value="Remote">🏠 Remote</option>
                    <option value="Client Site">🏢 Client Site</option>
                    <option value="Home Office">🏠 Home Office</option>
                    <option value="On-site">🔧 On-site</option>
                    <option value="Other">📍 Other</option>
                </select>
                <input type="text" id="taskLocationDetails" placeholder="Location Details (Optional)">
                <input type="number" id="taskEstimatedHours" placeholder="Estimated Hours" min="0" step="0.5">
                <button type="submit" class="btn-primary">Save Task</button>
            </form>
        </div>
    </div>

    <!-- Progress Log Modal -->
    <div id="progressModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('progressModal')">&times;</span>
            <h2>📝 Log Progress</h2>
            <form id="progressForm">
                <select id="progressTaskId" required>
                    <option value="">Choose a task...</option>
                </select>
                <textarea id="progressDescription" placeholder="What did you do?" required></textarea>
                <select id="progressLocation">
                    <option value="Office">🏢 Office</option>
                    <option value="Remote">🏠 Remote</option>
                    <option value="Client Site">🏢 Client Site</option>
                    <option value="Home Office">🏠 Home Office</option>
                    <option value="On-site">🔧 On-site</option>
                </select>
                <input type="text" id="progressLocationDetails" placeholder="Location Details (Optional)">
                <input type="number" id="progressValue" placeholder="Progress %" min="0" max="100">
                <input type="number" id="progressHours" placeholder="Hours Spent" min="0" step="0.5">
                <textarea id="progressNotes" placeholder="Additional Notes (Optional)"></textarea>
                <button type="submit" class="btn-primary">Log Progress</button>
            </form>
        </div>
    </div>

    <!-- Task Details Modal -->
    <div id="taskDetailsModal" class="modal">
        <div class="modal-content" style="max-width: 600px;">
            <span class="close-btn" onclick="closeModal('taskDetailsModal')">&times;</span>
            <h2 id="detailsTitle">Task Details</h2>
            <div id="taskDetailsContent"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        // Check authentication
        window.addEventListener('load', () => {
            const token = localStorage.getItem('authToken');
            const user = JSON.parse(localStorage.getItem('user') || '{}');

            if (!token) {
                window.location.href = '/login.html';
                return;
            }

            document.getElementById('userDisplay').textContent = `👤 ${user.name}`;
            
            // Redirect admins to admin dashboard
            if (user.role === 'admin') {
                // Allow but show option
                console.log('Admin user on main dashboard');
            }

            fetchTasks();
            fetchSummary();
            setupEventListeners();
            populateLocationFilter();
        });

        function logout() {
            const token = localStorage.getItem('authToken');
            axios.post('/api/auth/logout', {}, {
                headers: { Authorization: `Bearer ${token}` }
            }).catch(error => {
                console.error('Logout error:', error);
            }).finally(() => {
                localStorage.removeItem('authToken');
                localStorage.removeItem('user');
                window.location.href = '/login.html';
            });
        }
    </script>
    <script src="app.js"></script>
</body>
</html>
