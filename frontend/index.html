<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracking System - Gantt Chart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Task Tracking System</h1>
            <div class="header-actions">
                <button onclick="showAddTaskModal()" class="btn-primary">+ Add Task</button>
                <button onclick="showProgressModal()" class="btn-success">📝 Log Progress</button>
                <button onclick="refreshData()" class="btn-secondary">🔄 Refresh</button>
            </div>
        </header>

        <div class="summary-dashboard" id="summaryDashboard">
            <div class="summary-card">
                <h4>Total Tasks</h4>
                <p id="totalTasks">0</p>
            </div>
            <div class="summary-card">
                <h4>Completed</h4>
                <p id="completedTasks">0</p>
            </div>
            <div class="summary-card">
                <h4>In Progress</h4>
                <p id="inProgressTasks">0</p>
            </div>
            <div class="summary-card">
                <h4>Avg Progress</h4>
                <p id="avgProgress">0%</p>
            </div>
        </div>

        <div class="filters">
            <div class="filter-group">
                <label>Status:</label>
                <select id="statusFilter" onchange="applyFilters()">
                    <option value="all">All</option>
                    <option value="pending">Pending</option>
                    <option value="in-progress">In Progress</option>
                    <option value="completed">Completed</option>
                    <option value="delayed">Delayed</option>
                    <option value="on-hold">On Hold</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Priority:</label>
                <select id="priorityFilter" onchange="applyFilters()">
                    <option value="all">All</option>
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                    <option value="critical">Critical</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Location:</label>
                <select id="locationFilter" onchange="applyFilters()">
                    <option value="all">All Locations</option>
                </select>
            </div>
        </div>

        <div class="gantt-container">
            <div class="gantt-header">
                <div class="task-name-header">Task</div>
                <div class="gantt-timeline" id="ganttTimeline"></div>
            </div>
            <div id="ganttChart" class="gantt-chart"></div>
        </div>

        <div class="recent-activity">
            <h3>Recent Activity</h3>
            <div id="activityFeed" class="activity-feed"></div>
        </div>
    </div>

    <div id="taskModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('taskModal')">&times;</span>
            <h2 id="modalTitle">Add New Task</h2>
            <form id="taskForm">
                <input type="hidden" id="taskId">
                <div class="form-group">
                    <label>Title:</label>
                    <input type="text" id="taskTitle" required>
                </div>
                <div class="form-group">
                    <label>Description:</label>
                    <textarea id="taskDescription" rows="3"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Start Date:</label>
                        <input type="datetime-local" id="taskStartDate" required>
                    </div>
                    <div class="form-group">
                        <label>End Date:</label>
                        <input type="datetime-local" id="taskEndDate" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Location:</label>
                        <select id="taskLocation">
                            <option value="Office">🏢 Office</option>
                            <option value="Remote">🏠 Remote</option>
                            <option value="Client Site">🏢 Client Site</option>
                            <option value="Home Office">🏠 Home Office</option>
                            <option value="On-site">🔧 On-site</option>
                            <option value="Other">📍 Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Location Details:</label>
                        <input type="text" id="taskLocationDetails" placeholder="Building, room, address">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Progress (%):</label>
                        <input type="number" id="taskProgress" min="0" max="100" value="0">
                    </div>
                    <div class="form-group">
                        <label>Estimated Hours:</label>
                        <input type="number" id="taskEstimatedHours" step="0.5" value="0">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Priority:</label>
                        <select id="taskPriority">
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                            <option value="critical">Critical</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Status:</label>
                        <select id="taskStatus">
                            <option value="pending">Pending</option>
                            <option value="in-progress">In Progress</option>
                            <option value="on-hold">On Hold</option>
                            <option value="completed">Completed</option>
                            <option value="delayed">Delayed</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Assigned To:</label>
                    <input type="text" id="taskAssignedTo" placeholder="Team member name">
                </div>
                <button type="submit" class="btn-primary">Save Task</button>
            </form>
        </div>
    </div>

    <div id="progressModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('progressModal')">&times;</span>
            <h2>📝 Log Progress</h2>
            <form id="progressForm">
                <div class="form-group">
                    <label>Select Task:</label>
                    <select id="progressTaskId" required>
                        <option value="">Choose a task...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>What did you do?</label>
                    <textarea id="progressDescription" rows="3" placeholder="Describe what you accomplished..." required></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Location:</label>
                        <select id="progressLocation">
                            <option value="Office">🏢 Office</option>
                            <option value="Remote">🏠 Remote</option>
                            <option value="Client Site">🏢 Client Site</option>
                            <option value="Home Office">🏠 Home Office</option>
                            <option value="On-site">🔧 On-site</option>
                            <option value="Other">📍 Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Location Details:</label>
                        <input type="text" id="progressLocationDetails" placeholder="Building, room, address">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Progress Updated:</label>
                        <input type="number" id="progressValue" min="0" max="100" placeholder="0-100%">
                    </div>
                    <div class="form-group">
                        <label>Hours Spent:</label>
                        <input type="number" id="progressHours" step="0.5" placeholder="Hours">
                    </div>
                </div>
                <div class="form-group">
                    <label>Additional Notes:</label>
                    <textarea id="progressNotes" rows="2" placeholder="Any additional notes..."></textarea>
                </div>
                <button type="submit" class="btn-success">Log Progress</button>
            </form>
        </div>
    </div>

    <div id="taskDetailsModal" class="modal">
        <div class="modal-content modal-large">
            <span class="close" onclick="closeModal('taskDetailsModal')">&times;</span>
            <h2 id="detailsTitle">Task Details</h2>
            <div id="taskDetailsContent"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
